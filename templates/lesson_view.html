<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browniemade | {{ folder_name }} Lessons</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F9F6F0] text-[#4A4040] flex h-screen overflow-hidden">

    <!-- Navigation Sidebar -->
    <aside class="w-64 bg-white border-r border-[#EBE3D8] flex flex-col justify-between p-6">
        <div>
            <div class="flex items-center gap-2 mb-8">
                <span class="text-xl font-bold text-[#85AF83]">🤎 Browniemade</span>
            </div>
            <nav class="space-y-2">
                <a href="{{ url_for('dashboard') }}" class="flex items-center gap-3 px-4 py-2 text-gray-500 hover:bg-gray-50 rounded-xl transition">Dashboard</a>
                <a href="{{ url_for('chat') }}" class="flex items-center gap-3 px-4 py-2 text-gray-500 hover:bg-gray-50 rounded-xl transition">AI Tutor Bot</a>
            </nav>
        </div>
        <div>
            <a href="{{ url_for('logout') }}" class="flex items-center gap-3 px-4 py-2 text-rose-500 hover:bg-rose-50 rounded-xl transition text-sm font-medium">Log Out</a>
        </div>
    </aside>

    <!-- Main Content Workspace -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="bg-white border-b border-[#EBE3D8] p-6 flex justify-between items-center">
            <div>
                <a href="{{ url_for('dashboard') }}" class="text-xs font-bold text-[#85AF83] underline mb-1 inline-block">&larr; Back to Dashboard</a>
                <h1 class="text-xl font-bold text-[#2C462A] uppercase tracking-wide">{{ folder_name }} Lessons</h1>
                <p class="text-xs text-gray-400">Click any lesson to open or download it.</p>
            </div>
        </header>

        <div class="p-8 max-w-4xl w-full mx-auto space-y-4">
            {% if files %}
                {% for file in files %}
                    <div class="bg-white p-5 rounded-2xl border border-[#EBE3D8] flex justify-between items-center shadow-sm hover:border-[#B8D8B6] transition">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">📄</span>
                            <span class="text-sm font-bold text-[#4A4040]">{{ file }}</span>
                        </div>
                        <div class="flex gap-2">
                            <a href="{{ url_for('view_file', folder_name=folder_name, filename=file) }}" class="bg-[#85AF83] text-white px-4 py-2 rounded-xl text-xs font-medium hover:bg-[#739b71] transition">
                                Open File
                            </a>
                            <a href="{{ url_for('download_file', folder_name=folder_name, filename=file) }}" class="bg-gray-100 text-gray-600 px-3 py-2 rounded-xl text-xs font-medium hover:bg-gray-200 transition" title="Download">
                                ⬇
                            </a>
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="text-center text-gray-400 mt-20 bg-white p-10 rounded-2xl border border-[#EBE3D8]">
                    <p class="text-sm">No lesson files found in this folder yet.</p>
                </div>
            {% endif %}
        </div>
    </main>

</body>
</html>
