<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browniemade | Student Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F9F6F0] flex items-center justify-center h-screen text-[#4A4040]">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-[#EBE3D8] w-96">
        <h1 class="text-2xl font-bold mb-2 text-center">Create Account 🤎</h1>
        <p class="text-sm text-gray-500 text-center mb-6">Join Browniemade learning platform</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="bg-rose-50 text-rose-600 p-3 rounded-lg text-sm mb-4 text-center">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Choose Username</label>
                <input type="text" name="username" autocomplete="username" required class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-[#85AF83]">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Choose Password</label>
                <input type="password" name="password" autocomplete="new-password" required class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-[#85AF83]">
            </div>
            <button type="submit" class="w-full bg-[#85AF83] text-white py-2 rounded-lg font-medium hover:opacity-90 transition">Sign Up</button>
        </form>
        <p class="text-xs text-center text-gray-500 mt-4">Already have an account? <a href="{{ url_for('login') }}" class="text-[#85AF83] font-medium underline">Log in</a></p>
    </div>
</body>
</html>
